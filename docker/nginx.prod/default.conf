# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name nusaweb.site www.nusaweb.site;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name nusaweb.site www.nusaweb.site;
    root /var/www/public;
    index index.php index.html;

    # SSL Certificates
    ssl_certificate     /etc/nginx/certs/live/nusaweb.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/nusaweb.site/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self';
        connect-src 'self' wss: ws: https://api.exchangerate-api.com https://restcountries.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://code.jquery.com https://cdnjs.cloudflare.com https://nusaweb.site;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://fonts.bunny.net https://cdnjs.cloudflare.com;
        img-src 'self' data: https:;
        object-src 'none';
        frame-src 'self';
    " always;

    # Maximum Upload Size
    client_max_body_size 100M;

    # Handle Livewire assets specifically
    location ~* ^/livewire/.+\.(js|css|map)$ {
        try_files $uri $uri/ @livewire;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback for Livewire assets
    location @livewire {
        rewrite ^/livewire/(.*)$ /index.php?livewire=$1 last;
    }

    # Static Asset Caching (moved before Laravel routing)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        try_files $uri $uri/ @static;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Fallback for static assets
    location @static {
        try_files $uri /index.php?$query_string;
    }

    # Laravel Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handling
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass laravel_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Add these parameters for better PHP handling
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
    }

    # Block Access to Hidden Files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive files
    location ~* \.(env|git|gitignore|gitattributes|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}